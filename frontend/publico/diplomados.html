<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diplomados y Programas Ejecutivos Disponibles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060f; --border:rgba(255,255,255,0.09);
    --text:#f4f6ff; --muted:#9aa3c0; --violet:#7c6cff; --magenta:#ea3fa0; --teal:#2fe9d0; --gold:#ffb84d;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #bg-canvas{ position:fixed; inset:0; z-index:0; opacity:0.55; }

  .orb{ position:fixed; border-radius:50%; filter:blur(70px); z-index:0; pointer-events:none; }
  .orb-1{ width:480px; height:480px; top:-160px; left:-120px; background:radial-gradient(circle, rgba(124,108,255,0.35), transparent 70%); animation:drift1 22s ease-in-out infinite; }
  .orb-2{ width:420px; height:420px; top:20%; right:-140px; background:radial-gradient(circle, rgba(234,63,160,0.28), transparent 70%); animation:drift2 26s ease-in-out infinite; }
  .orb-3{ width:380px; height:380px; bottom:-160px; left:30%; background:radial-gradient(circle, rgba(47,233,208,0.22), transparent 70%); animation:drift3 30s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(60px,50px); } }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-50px,60px); } }
  @keyframes drift3{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(40px,-40px); } }

  .grid-overlay{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.35;
    background-image: linear-gradient(rgba(124,108,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(124,108,255,0.08) 1px, transparent 1px);
    background-size:46px 46px; mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black, transparent 75%);
  }

  header{ position:relative; z-index:2; padding:28px 16px 22px; text-align:center; }
  .brand{
    font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.01em;
    background:linear-gradient(90deg, var(--violet), var(--teal), var(--magenta), var(--violet));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hue-shift 8s linear infinite; display:inline-block; max-width:680px; margin:0 auto; line-height:1.3;
  }
  @keyframes hue-shift{ to{ background-position:300% center; } }

  main{ position:relative; z-index:2; max-width:1160px; margin:0 auto; padding:8px 16px 70px; }

  .section-label{
    font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; font-weight:700; margin-bottom:14px;
    display:flex; align-items:center; gap:8px; color:var(--teal);
  }
  .section-label::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--teal); box-shadow:0 0 10px var(--teal); }

  .destacado{ margin-bottom:44px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(270px, 1fr)); gap:20px; }
  .destacado .grid{ grid-template-columns:1fr; }

  .reveal{ opacity:0; transform:translateY(24px); transition:opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  .card{
    display:flex; flex-direction:column; border-radius:20px; overflow:hidden;
    background:linear-gradient(160deg, #1b2350, #2a1a4a 55%, #3a1440);
    border:1px solid var(--border); box-shadow:0 14px 34px -16px rgba(0,0,0,0.6);
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
  }
  .card:hover{ transform:translateY(-6px) scale(1.015); border-color:rgba(124,108,255,0.5); box-shadow:0 22px 46px -14px rgba(124,108,255,0.35); }
  .card.destacada{
    box-shadow:0 0 0 1.5px rgba(47,233,208,0.6), 0 0 40px rgba(47,233,208,0.25), 0 26px 55px -18px rgba(0,0,0,0.7);
    animation:glow-pulse 3.4s ease-in-out infinite;
  }
  .card.destacada:hover{ transform:translateY(-4px) scale(1.008); }
  @keyframes glow-pulse{
    0%,100%{ box-shadow:0 0 0 1.5px rgba(47,233,208,0.6), 0 0 40px rgba(47,233,208,0.22), 0 26px 55px -18px rgba(0,0,0,0.7); }
    50%{ box-shadow:0 0 0 1.5px rgba(47,233,208,0.85), 0 0 60px rgba(47,233,208,0.4), 0 26px 55px -18px rgba(0,0,0,0.7); }
  }

  /* Bloque de imagen: la foto (o el fondo degradado si no hay foto) vive acá,
     separado del texto, para que nunca se pisen aunque la foto ya traiga texto
     propio (ej. la portada de un PDF). */
  .card-image-wrap{ position:relative; width:100%; aspect-ratio:4/3; overflow:hidden; flex-shrink:0; }
  .card.destacada .card-image-wrap{ aspect-ratio:16/9; }
  .card-foto{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 15%; transform-origin:top center; transition:transform 0.6s ease; display:block; }
  .card:hover .card-foto{ transform:scale(1.07); }
  .card-shine{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity 0.4s ease;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.16) 50%, transparent 60%);
    background-size:250% 250%; background-position:0% 0%;
  }
  .card:hover .card-shine{ opacity:1; animation:shine-sweep 1.1s ease forwards; }
  @keyframes shine-sweep{ from{ background-position:130% 0%; } to{ background-position:-30% 0%; } }

  .card-content{ display:flex; flex-direction:column; gap:7px; padding:18px 20px 16px; flex:1; }
  .card-badge{
    align-self:flex-start; background:linear-gradient(90deg, var(--magenta), #ff6bb0); color:#fff; font-size:10px; font-weight:700;
    letter-spacing:0.06em; text-transform:uppercase; padding:5px 12px; border-radius:999px; margin-bottom:2px;
    box-shadow:0 0 16px rgba(234,63,160,0.55);
  }
  .card-title{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:800; line-height:1.25; letter-spacing:-0.01em; }
  .card.destacada .card-title{ font-size:26px; text-transform:uppercase; }
  .card-docentes{ font-size:12px; color:#c9cfe8; }
  .card-desc{ font-size:13px; color:#d7dcf7; line-height:1.55; }
  .card-precio{ font-family:'Space Grotesk', sans-serif; font-size:17px; font-weight:800; color:var(--teal); margin-top:2px; }

  .btn-comprar{
    margin-top:9px; display:inline-flex; align-items:center; justify-content:center; gap:8px; align-self:flex-start;
    background:linear-gradient(90deg, var(--violet), var(--magenta)); background-size:180% auto; color:#fff; font-weight:700;
    text-decoration:none; padding:12px 22px; border-radius:11px; font-size:14px; transition:background-position 0.5s ease, transform 0.2s ease, box-shadow 0.3s ease;
    box-shadow:0 8px 22px -8px rgba(124,108,255,0.6);
  }
  .btn-comprar:hover{ background-position:100% center; box-shadow:0 10px 28px -6px rgba(234,63,160,0.55); }
  .btn-comprar:active{ transform:scale(0.97); }

  .card-tag{
    text-align:center; padding:7px 8px; background:rgba(0,0,0,0.4); border-top:1px solid rgba(255,255,255,0.12);
    font-size:10px; letter-spacing:0.28em; font-weight:600; color:#e8eaf8;
  }

  .card.clickable{ cursor:pointer; }
  .card.clickable:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }
  .card-hint{
    position:absolute; top:14px; right:14px; z-index:4; background:rgba(6,5,18,0.75); backdrop-filter:blur(6px);
    border:1px solid rgba(47,233,208,0.5); color:var(--teal); font-size:11px; font-weight:700;
    padding:6px 12px; border-radius:999px; opacity:0; transform:translateY(-6px); transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
  }
  .card.clickable:hover .card-hint{ opacity:1; transform:translateY(0); }

  .hero-pdf{ display:grid; grid-template-columns:1fr; gap:20px; align-items:start; }
  .hero-pdf-viewer{
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border); background:#11131f;
    box-shadow:0 0 0 1.5px rgba(47,233,208,0.6), 0 0 40px rgba(47,233,208,0.22), 0 26px 55px -18px rgba(0,0,0,0.7);
    animation:glow-pulse 3.4s ease-in-out infinite;
  }
  .hero-pdf-viewer iframe{ width:100%; height:72vh; min-height:420px; max-height:820px; border:none; display:block; background:#fff; }
  .hero-pdf-fallback{
    display:block; text-align:center; padding:11px; font-size:12.5px; font-weight:600; color:var(--teal); text-decoration:none;
    background:rgba(0,0,0,0.4); border-top:1px solid rgba(255,255,255,0.1);
  }

  /* En celular, la mayoría de los navegadores no pueden mostrar el PDF incrustado
     (queda una caja vacía) — se muestra en su lugar la foto de portada con un
     botón grande para abrir el PDF completo. */
  .hero-pdf-mobile-card{ display:none; }
  .hero-pdf-mobile-img{ width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .hero-pdf-mobile-placeholder{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:56px;
    background:linear-gradient(160deg, #1b2350, #2a1a4a 55%, #3a1440);
  }
  @media (max-width:760px){
    .hero-pdf-viewer{ min-height:420px; }
    .hero-pdf-viewer iframe, .hero-pdf-fallback{ display:none; }
    .hero-pdf-mobile-card{ display:flex; flex-direction:column; position:absolute; inset:0; }
    .hero-pdf-mobile-card .btn-comprar{ margin:0; border-radius:0; width:100%; padding:16px; font-size:15px; justify-content:center; box-shadow:none; }
  }
  .hero-pdf-side{
    background:linear-gradient(160deg, #1b2350, #2a1a4a 55%, #3a1440); border:1px solid var(--border); border-radius:20px;
    padding:26px 24px; display:flex; flex-direction:column; gap:10px;
  }
  .hero-pdf-title{ font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:22px; text-transform:uppercase; line-height:1.25; }
  .hero-pdf-precio{ font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:19px; color:var(--teal); text-shadow:0 0 20px rgba(47,233,208,0.4); }
  .card-desc{ font-size:13.5px; color:#dfe3f7; line-height:1.65; }
  .card-desc a{ color:var(--teal); text-decoration:underline; }

  .precio-antes{ text-decoration:line-through; color:var(--muted); font-weight:600; font-size:0.75em; margin-right:8px; }
  .precio-oferta-tag{
    display:inline-block; background:linear-gradient(90deg, #ff6b5d, var(--magenta)); color:#fff; font-size:10px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; padding:2px 8px; border-radius:999px; vertical-align:middle;
  }
  .card-precio.con-oferta, .hero-pdf-precio.con-oferta{ line-height:1.6; }

  .empty{ text-align:center; color:var(--muted); padding:80px 20px; font-size:14px; position:relative; z-index:2; }
  .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid rgba(124,108,255,0.25); border-top-color:var(--violet); margin:0 auto 14px; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  footer{ position:relative; z-index:2; text-align:center; padding:26px 16px 40px; color:var(--muted); font-size:11.5px; letter-spacing:0.04em; }

  .home-btn{
    position:absolute; top:18px; left:16px; z-index:3; display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text); text-decoration:none;
    font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; transition:background 0.2s ease, border-color 0.2s ease;
  }
  .home-btn:hover{ background:rgba(124,108,255,0.18); border-color:rgba(124,108,255,0.4); }

  @media (min-width:720px){
    header{ padding:40px 16px 30px; }
    .brand{ font-size:32px; }
    main{ padding:12px 24px 90px; }
  }

  @media (min-width:900px){
    .hero-pdf{ grid-template-columns:2.1fr 1fr; }
    .hero-pdf-side{ position:sticky; top:24px; }
  }

  .wa-fab{
    position:fixed; bottom:22px; right:22px; z-index:50; width:60px; height:60px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center; text-decoration:none;
    box-shadow:0 6px 20px rgba(37,211,102,0.5); transition:transform 0.2s ease, box-shadow 0.2s ease;
    animation:wa-pulse 2.4s ease-in-out infinite;
  }
  .wa-fab:hover{ transform:scale(1.08); }
  .wa-fab svg{ width:30px; height:30px; }
  @keyframes wa-pulse{
    0%,100%{ box-shadow:0 6px 20px rgba(37,211,102,0.5), 0 0 0 0 rgba(37,211,102,0.45); }
    50%{ box-shadow:0 6px 20px rgba(37,211,102,0.5), 0 0 0 12px rgba(37,211,102,0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="grid-overlay"></div>

<header>
  <a id="home-link" class="home-btn" href="/diplomados" style="display:none;">← Ver todos los diplomados</a>
  <div class="brand">🎓 Diplomados y Programas Ejecutivos Disponibles</div>
</header>

<main id="main">
  <div class="empty"><div class="spinner"></div>Cargando diplomados...</div>
</main>

<a id="wa-fab" class="wa-fab" href="#" target="_blank" rel="noopener" aria-label="Chatear por WhatsApp">
  <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413" /></svg>
</a>


<script>
  var WHATSAPP_CONTACTO = '595994656933'; // Número de WhatsApp para consultas/compra desde esta página pública.
  var REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('wa-fab').href =
    'https://api.whatsapp.com/send?phone=' + WHATSAPP_CONTACTO +
    '&text=' + encodeURIComponent('Hola, quiero más información sobre los diplomados.');

  // ---------- Fondo animado tipo "red neuronal" ----------
  (function initCanvas() {
    if (REDUCED_MOTION) return;
    var canvas = document.getElementById('bg-canvas');
    var ctx = canvas.getContext('2d');
    var w, h, particles;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function initParticles() {
      var count = w < 640 ? 26 : 55;
      particles = [];
      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
        });
      }
    }

    function tick() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;

        for (var j = i + 1; j < particles.length; j++) {
          var q = particles[j];
          var dx = p.x - q.x, dy = p.y - q.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 140) {
            ctx.strokeStyle = 'rgba(124,108,255,' + (0.16 * (1 - dist / 140)) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          }
        }
        ctx.fillStyle = 'rgba(47,233,208,0.55)';
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(tick);
    }

    resize();
    initParticles();
    window.addEventListener('resize', function () { resize(); initParticles(); });
    requestAnimationFrame(tick);
  })();

  // ---------- Datos y render ----------
  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function fmtGs(n) {
    return '₲ ' + Math.round(n || 0).toLocaleString('es-PY');
  }

  function linkComprar(nombre) {
    var texto = encodeURIComponent('Hola, quiero información sobre ' + nombre + '.');
    return 'https://api.whatsapp.com/send?phone=' + WHATSAPP_CONTACTO + '&text=' + texto;
  }

  function docentesHtml(p) {
    if (!p.docentes) return '';
    var nombres = p.docentes.split(',').map(function (n) { return n.trim(); }).filter(Boolean);
    var etiqueta = nombres.length > 1 ? 'Docentes: ' : 'Docente: ';
    return '<div class="card-docentes">👤 ' + etiqueta + escapeHtml(nombres.join(' · ')) + '</div>';
  }

  function precioHtml(p, claseBase) {
    if (p.precioOferta && p.precioOferta < p.precio) {
      return (
        '<div class="' + claseBase + ' con-oferta">' +
          '<span class="precio-antes">' + fmtGs(p.precio) + '</span>' +
          '<span class="precio-oferta-tag">🏷️ Oferta</span><br>' +
          fmtGs(p.precioOferta) +
        '</div>'
      );
    }
    return '<div class="' + claseBase + '">' + fmtGs(p.precio) + '</div>';
  }

  function cardHtml(p, destacada) {
    var foto = p.fotoUrl ? '<img class="card-foto" src="' + p.fotoUrl + '" alt="" />' : '';
    var claseClick = destacada ? '' : ' clickable';
    var atrClick = destacada ? '' : ' onclick="location.href=\'/diplomados/' + p.id + '\'" onkeydown="if(event.key===\'Enter\')location.href=\'/diplomados/' + p.id + '\'" role="link" tabindex="0"';

    return (
      '<div class="card reveal' + (destacada ? ' destacada' : claseClick) + '"' + atrClick + '>' +
        '<div class="card-image-wrap">' +
          foto +
          '<div class="card-shine"></div>' +
          (destacada ? '' : '<div class="card-hint">👁️ Ver diplomado</div>') +
        '</div>' +
        '<div class="card-content">' +
          '<span class="card-badge">Diplomado en:</span>' +
          '<div class="card-title">' + escapeHtml(p.nombre) + '</div>' +
          docentesHtml(p) +
          (destacada && p.descripcionPromo ? '<div class="card-desc">' + p.descripcionPromo + '</div>' : '') +
          precioHtml(p, 'card-precio') +
          '<a class="btn-comprar" href="' + linkComprar(p.nombre) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">🛒 Comprar / Consultar</a>' +
        '</div>' +
        '<div class="card-tag">USIL BUSINESS SCHOOL</div>' +
      '</div>'
    );
  }

  function heroPdfHtml(p) {
    var pdfEmbed = p.brochurePdfUrl + '#toolbar=0&navpanes=0&scrollbar=0';
    var fotoMobile = p.fotoUrl
      ? '<img class="hero-pdf-mobile-img" src="' + p.fotoUrl + '" alt="" />'
      : '<div class="hero-pdf-mobile-placeholder">📄</div>';

    return (
      '<div class="hero-pdf reveal">' +
        '<div class="hero-pdf-viewer">' +
          '<iframe src="' + pdfEmbed + '" title="Broshure ' + escapeHtml(p.nombre) + '"></iframe>' +
          '<a class="hero-pdf-fallback" href="' + p.brochurePdfUrl + '" target="_blank" rel="noopener">🔍 Abrir en pantalla completa</a>' +
          '<div class="hero-pdf-mobile-card">' +
            fotoMobile +
            '<a class="btn-comprar" href="' + p.brochurePdfUrl + '" target="_blank" rel="noopener">📄 Ver Broshure Completo (PDF)</a>' +
          '</div>' +
        '</div>' +
        '<div class="hero-pdf-side">' +
          '<span class="card-badge">Diplomado en:</span>' +
          '<div class="hero-pdf-title">' + escapeHtml(p.nombre) + '</div>' +
          docentesHtml(p) +
          (p.descripcionPromo ? '<div class="card-desc">' + p.descripcionPromo + '</div>' : '') +
          precioHtml(p, 'hero-pdf-precio') +
          '<a class="btn-comprar" href="' + linkComprar(p.nombre) + '" target="_blank" rel="noopener">🛒 Comprar / Consultar</a>' +
        '</div>' +
      '</div>'
    );
  }

  function activarReveal() {
    var els = document.querySelectorAll('.reveal');
    if (REDUCED_MOTION || !('IntersectionObserver' in window)) {
      els.forEach(function (el) { el.classList.add('in'); });
      return;
    }
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry, i) {
        if (entry.isIntersecting) {
          setTimeout(function () { entry.target.classList.add('in'); }, i * 60);
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    els.forEach(function (el) { obs.observe(el); });
  }

  function render(diplomados) {
    var main = document.getElementById('main');
    var idDestacado = location.pathname.split('/')[2] || null;

    if (diplomados.length === 0) {
      main.innerHTML = '<div class="empty">No hay diplomados disponibles por el momento.</div>';
      return;
    }

    var destacado = idDestacado ? diplomados.find(function (p) { return p.id === idDestacado; }) : null;
    var resto = destacado ? diplomados.filter(function (p) { return p.id !== destacado.id; }) : diplomados;

    document.getElementById('home-link').style.display = destacado ? 'inline-flex' : 'none';

    var html = '';
    if (destacado) {
      var label = destacado.preview ? '👁️ Vista previa (todavía no publicado)' : '✨ Este diplomado te interesa';
      var cuerpoDestacado = destacado.brochurePdfUrl
        ? heroPdfHtml(destacado)
        : '<div class="grid">' + cardHtml(destacado, true) + '</div>';

      html += '<div class="destacado">' +
        '<div class="section-label">' + label + '</div>' +
        cuerpoDestacado +
      '</div>';
      if (resto.length > 0) {
        html += '<div class="section-label">Otros diplomados activos</div>';
      }
    }
    html += '<div class="grid">' + resto.map(function (p) { return cardHtml(p, false); }).join('') + '</div>';

    main.innerHTML = html;
    activarReveal();
  }

  var idDeUrl = location.pathname.split('/')[2] || '';
  var query = idDeUrl ? '?previewId=' + encodeURIComponent(idDeUrl) : '';

  fetch('/api/publico/diplomados' + query)
    .then(function (res) { return res.json(); })
    .then(render)
    .catch(function () {
      document.getElementById('main').innerHTML = '<div class="empty">No se pudieron cargar los diplomados. Intenta de nuevo más tarde.</div>';
    });
</script>

</body>
</html>
